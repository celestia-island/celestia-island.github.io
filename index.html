<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Celestia Island — A constellation of open-source projects: AI agents, web frameworks, UI libraries, authentication, and industrial tools." />
  <meta name="theme-color" content="#8b5cf6" />

  <!--
    Extra footer content (e.g. the ICP filing line), injected by the Docker
    image at container start (see docker/entrypoint.sh): a plain HTML string
    or a JSON array of strings, one line per entry. The script tag keeps raw
    quotes valid (an attribute would be broken by the embedded HTML). On
    static hosts the $FOOTER_EXTRA placeholder stays in place and the app
    hides it. A build-time VITE_FOOTER_EXTRA is honoured too.
  -->
  <script type="application/json" id="celestia-footer-extra">$FOOTER_EXTRA</script>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Celestia Island" />
  <meta property="og:description" content="An independent open-source organization exploring the frontiers of systems engineering" />
  <meta property="og:url" content="https://celestia.world" />
  <meta property="og:image" content="https://celestia.world/logos/celestia.webp" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Celestia Island" />
  <meta name="twitter:description" content="An independent open-source organization exploring the frontiers of systems engineering" />
  <meta name="twitter:image" content="https://celestia.world/logos/celestia.webp" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon-48x48.png" sizes="48x48" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/site.webmanifest" />
  <script>
    (function(){try{var t=localStorage.getItem('celestia-theme')||'dark';document.documentElement.classList.toggle('dark',t==='dark');document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
  </script>
  <title>Celestia Island</title>
</head>
<body class="m-0 p-0 overflow-x-hidden font-sans">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

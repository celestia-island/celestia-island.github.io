name: Format

# One in-flight run per ref: a superseded push cancels its
# predecessor instead of queueing behind it (farm-pressure
# relief, AGENTS ci-ops 8.3.3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fmt.yml'
      - 'docs/**'
      - '**/*.md'
      - 'justfile'
      - 'celestia-devtools.just'
    types: [opened, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  format:
    name: Markdown format
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 60
    env:
      # See build.yml: setup-python has no Debian standalone builds; use the
      # runner's system Python (3.11) with user-site pip installs (PEP 668).
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install just
        run: |
          curl -sSL https://github.com/casey/just/releases/download/1.55.1/just-1.55.1-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo install just /usr/local/bin
      - run: just fetch
      - run: just ensure
      - run: just fmt-check

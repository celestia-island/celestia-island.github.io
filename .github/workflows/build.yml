name: Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'scripts/**'
      - 'shaders/**'
      - 'res/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'uno.config.ts'
      - 'index.html'
      - 'justfile'

    types: [opened, reopened, ready_for_review]
jobs:
  build:
    name: Build site
    runs-on: [self-hosted, linux, x64, local]
    env:
      # actions/setup-python cannot download standalone builds for Debian, so
      # use the runner's system Python (3.11) and let pip install into the
      # user site despite Debian's externally-managed marker (PEP 668).
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Unique install dir per run: the self-installer replaces the whole
          # directory when upgrading pnpm, and concurrent jobs on the same
          # self-hosted runner race on a shared one (ENOTEMPTY / lost shims).
          dest: ~/setup-pnpm-build-${{ github.run_id }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'pnpm'
      - name: Install just
        run: |
          curl -sSL https://github.com/casey/just/releases/download/1.55.1/just-1.55.1-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo install just /usr/local/bin
      - run: just fetch
      - run: just install
      - run: just build
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7

name: Docker

# Builds the site image and publishes it to both the company Aliyun ACR registry
# (what the website nodes pull — GHCR is unreliable from mainland China) and GHCR
# (the canonical public copy). On pull requests the image is only built, not
# pushed.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Needed to push the image to GHCR with the workflow's own GITHUB_TOKEN.
  packages: write

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: crpi-88d7shkt0yo9qvvt.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            crpi-88d7shkt0yo9qvvt.cn-shanghai.personal.cr.aliyuncs.com/langyo_personal/celestia-island.github.io
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Aliyun ACR rejects buildx attestation manifests
          # (application/vnd.oci.empty.v1+json), so provenance must stay off.
          # Both registries are fed by this single build, so GHCR ships without
          # attestations too — the two copies stay byte-identical.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

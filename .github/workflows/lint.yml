name: Lint

# One in-flight run per ref: a superseded push cancels its
# predecessor instead of queueing behind it (farm-pressure
# relief, AGENTS ci-ops 8.3.3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:

  type-escapes:
    name: Type escape hatches
    uses: celestia-island/celestia-devtools/.github/workflows/type-escapes.yml@46e95519848940ebbaae60023dc03bb7a114c5ec
    with:
      devtools-ref: 46e95519848940ebbaae60023dc03bb7a114c5ec
  lint:
    # Fork pull requests pay for their own CI: this job is heavy (it compiles,
    # builds, tests or audits) and a fork's run would spend shared runner time on
    # untrusted content. The required commit-lint and PR-title checks are the
    # deliberate exception: they are sub-minute, execute no pull request code, and
    # hold no secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Typecheck (vue-tsc)
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 120
    env:
      # See build.yml: use the runner's system Python (3.11) with user-site
      # pip installs; setup-python has no Debian standalone builds.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # Unique install dir per run (see build.yml): concurrent self-installs
          # into a shared directory race on this runner.
          dest: ~/setup-pnpm-lint-${{ github.run_id }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: 'pnpm'
      - name: Install just
        run: |
          curl -sSL https://github.com/casey/just/releases/download/1.55.1/just-1.55.1-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo install just /usr/local/bin
      - name: Stage the shared devtools just recipes
        # `.just/` is gitignored and can only ever be staged by `just fetch`
        # itself, so a pristine checkout has no `fetch` recipe at all — that is
        # why this bootstrap must exist. Install the control-plane CLI at the
        # same pinned ref the reusable workflows above use (never a floating
        # branch) and let it drop the bundled common.just into `.just/`; the
        # `just fetch` below then finds the staged copy already current.
        run: |
          python3 -m pip install --quiet --upgrade --user \
            "celestia-devtools @ git+https://github.com/celestia-island/celestia-devtools@3779c1961f8f08bf60b21458894667a9b6c3599a"
          python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"
          python3 -m celestia_devtools fetch-just
      - run: just fetch
      - run: just install
      - run: just lint

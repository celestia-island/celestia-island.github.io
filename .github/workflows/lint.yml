name: Lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lint.yml'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'uno.config.ts'
      - 'justfile'
  push:
    branches: [main, dev]

jobs:
  lint:
    name: Typecheck (vue-tsc)
    runs-on: [self-hosted, linux, x64, local]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'pnpm'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install just
        run: |
          curl -sSL https://github.com/casey/just/releases/download/1.55.1/just-1.55.1-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo install just /usr/local/bin
      - run: just fetch
      - run: just install
      - run: just lint
